<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Locker System</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS ตกแต่ง (คงเดิมไว้ทั้งหมด) */
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .hidden { display: none !important; }
        
        h2 { margin-top: 0; color: #333; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; 
            text-align: center; /* จัดตัวเลขให้อยู่ตรงกลาง */
        }
        
        .btn { width: 100%; padding: 12px; background: #06c755; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #05b34c; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        /* Grid ตารางตู้ */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .l-btn { padding: 20px; border-radius: 10px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        .l-btn:active { transform: scale(0.95); }
        .available { background-color: #28a745; box-shadow: 0 4px #1e7e34; } 
        .occupied { background-color: #dc3545; opacity: 0.6; cursor: not-allowed; }
        .menu-btn { background: #007bff; margin-bottom: 15px; padding: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="pageLogin">
            <h2>🔐 เข้าสู่ระบบ</h2>
            <p>กรุณากรอกเบอร์โทรศัพท์เพื่อรับ OTP</p>
            <input type="tel" id="loginPhone" placeholder="+66xxxxxxxxx" value="+66">
            <div id="recaptcha-container" style="margin: 10px auto;"></div>
            <button class="btn" onclick="sendOTP()">📩 รับรหัส OTP</button>
        </div>

        <div id="pageOTP" class="hidden">
            <h2>📱 ยืนยันรหัส OTP</h2>
            <p>กรอกรหัส 6 หลักที่ได้รับทาง SMS</p>
            <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="letter-spacing: 5px; font-size: 20px;">
            <button class="btn" onclick="verifyOTP()">ยืนยัน</button>
            <button class="btn btn-secondary" onclick="location.reload()">ย้อนกลับ</button>
        </div>

        <div id="pageMenu" class="hidden">
            <h2>📦 Smart Locker</h2>
            <p id="welcomeUser" style="color:#666; font-size:14px; margin-bottom: 20px;">ยินดีต้อนรับ</p>
            
            <button class="btn menu-btn" onclick="nav('sender')">📦 ฝากของ / จองตู้</button>
            <button class="btn menu-btn" style="background:#17a2b8;" onclick="nav('receiver')">🔍 ค้นหาพัสดุ / รับของ</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div id="pageSender" class="hidden">
            <h3>เลือกตู้ที่ว่าง</h3>
            <div id="lockerGrid" class="grid">กำลังโหลด...</div>
            
            <div id="reserveForm" class="hidden" style="margin-top:20px; background:#f8f9fa; padding:15px; border-radius:10px;">
                <p style="margin:5px 0;">คุณเลือก: <b style="color:#007bff; font-size:1.2em;">ตู้ <span id="targetLocker">-</span></b></p>
                
                <p style="font-size:14px; color:#555; margin-bottom:5px;">ระบุเบอร์ผู้รับ (4 ตัวท้าย)</p>
                <input type="tel" id="rPhone" placeholder="เช่น 1234" maxlength="4" style="font-size: 24px; letter-spacing: 3px; font-weight:bold;">
                
                <button class="btn" onclick="doReserve()">ยืนยันการฝาก</button>
            </div>
            <button class="btn btn-secondary" style="margin-top:20px;" onclick="nav('menu')">กลับเมนูหลัก</button>
        </div>

        <div id="pageReceiver" class="hidden">
            <h3>🔍 ค้นหาพัสดุ</h3>
            <p>กรอกเลข 4 ตัวท้ายของเบอร์โทร</p>
            
            <input type="tel" id="sPhone" placeholder="xxxx" maxlength="4" style="font-size: 24px; letter-spacing: 3px; font-weight:bold;">
            
            <button class="btn" onclick="doSearch()">ค้นหา</button>
            <div id="resultBox" style="margin-top:15px;"></div>
            <button class="btn btn-secondary" style="margin-top:20px;" onclick="nav('menu')">กลับเมนูหลัก</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // 1. Config ของคุณ
        const firebaseConfig = {
          apiKey: "AIzaSyD2pT2lhklqjcyhCtnZlKB4mExom8X3SZA",
          authDomain: "locker-project-01.firebaseapp.com",
          projectId: "locker-project-01",
          storageBucket: "locker-project-01.firebasestorage.app",
          messagingSenderId: "395172693891",
          appId: "1:395172693891:web:f4261fd635fb2cc852d8b6",
          measurementId: "G-63FCGRHW6J"
        };
        
        // ✅ 2. อัปเดต API URL เป็นลิ้งค์ใหม่ของคุณ (ที่แก้แล้ว)
        const API_URL = "https://script.google.com/macros/s/AKfycbye1eOC3RvzH7LpqtN-ZGdRy2Ege7UcXeTL4bgkae8Qm9mPpdayAVsvcV3ipbTk3VLL/exec";
        
        // ✅ 3. ใส่ LIFF ID (เพื่อให้จับตัวคนร้าย/ลูกค้าได้)
        const LIFF_ID = "2008871806-DD5gVMPU"; 

        // เริ่มต้น Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.languageCode = 'th';

        // ตัวแปรระบบ
        let confirmationResult = null;
        let currentUserPhone = "";
        let selectedLocker = null;
        let currentLineUserId = ""; // ✅ ตัวแปรเก็บ ID ลูกค้า

        // --- ✅ 4. เริ่มต้น LIFF (ดักจับ ID) ---
        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentLineUserId = profile.userId; // ได้ตัวแล้ว! เก็บไว้ส่งหลังบ้าน
                    console.log("LINE User ID:", currentLineUserId);
                } else if (liff.isInClient()) {
                    liff.login(); // ถ้าเปิดในไลน์แต่ยังไม่ล็อกอิน ก็สั่งล็อกอินเลย
                }
            } catch (err) { console.error("LIFF Error:", err); }
        }
        initLIFF(); // เรียกทำงานทันทีที่เปิดเว็บ

        // 2. ระบบจำรหัส (LINE จำยาว / Web จำสั้น)
        const isLineApp = /Line/i.test(navigator.userAgent);
        auth.setPersistence(isLineApp ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION)
            .catch(e=>console.error("Persistence Error:", e));

        // 3. ตรวจสอบสถานะ (Main Logic)
        auth.onAuthStateChanged((user) => {
            const allPages = ['pageLogin', 'pageOTP', 'pageMenu', 'pageSender', 'pageReceiver'];
            
            if (user) {
                // --> ล็อกอินแล้ว
                currentUserPhone = user.phoneNumber; 
                document.getElementById('welcomeUser').innerText = "ผู้ใช้งาน: " + currentUserPhone;
                
                // ซ่อนหน้า Login
                document.getElementById('pageLogin').classList.add('hidden');
                document.getElementById('pageOTP').classList.add('hidden');
                
                // เช็ค Deep Link
                checkDeepLink();
            } else {
                // --> ยังไม่ล็อกอิน
                allPages.forEach(id => document.getElementById(id)?.classList.add('hidden'));
                document.getElementById('pageLogin').classList.remove('hidden');
                renderRecaptcha(); // เตรียม Captcha
            }
        });

        function checkDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page');
            if (page === 'sender') nav('sender');
            else if (page === 'receiver') nav('receiver');
            else nav('menu');
        }

        // --- ฟังก์ชันเปลี่ยนหน้า ---
        function nav(p) {
            ['pageMenu', 'pageSender', 'pageReceiver'].forEach(id => document.getElementById(id).classList.add('hidden'));
            
            if(p=='menu') document.getElementById('pageMenu').classList.remove('hidden');
            
            if(p=='sender') { 
                document.getElementById('pageSender').classList.remove('hidden'); 
                loadLockers(); 
                document.getElementById('rPhone').value = ""; 
            }
            
            if(p=='receiver') { 
                document.getElementById('pageReceiver').classList.remove('hidden'); 
                document.getElementById('resultBox').innerHTML=""; 
                if(currentUserPhone && currentUserPhone.length > 4) {
                    document.getElementById('sPhone').value = currentUserPhone.slice(-4);
                }
            }
        }

        // --- Recaptcha ---
        function renderRecaptcha() {
            const container = document.getElementById('recaptcha-container');
            if(container && container.hasChildNodes()) return;
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'normal' });
                window.recaptchaVerifier.render();
            }
        }

        // --- ส่ง SMS OTP ---
        function sendOTP() {
            const ph = document.getElementById('loginPhone').value;
            if (ph.length < 10) return alert("กรุณากรอกเบอร์ให้ครบ");
            
            const btn = event.target;
            btn.innerText = "กำลังส่ง..."; btn.disabled = true;
            renderRecaptcha(); 

            auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then((res) => {
                confirmationResult = res;
                document.getElementById('pageLogin').classList.add('hidden');
                document.getElementById('pageOTP').classList.remove('hidden');
                alert("✅ ส่ง OTP แล้ว");
                btn.innerText = "รับรหัส OTP"; btn.disabled = false;
            }).catch(e => { 
                alert("Error: " + e.message); 
                btn.innerText = "รับรหัส OTP"; btn.disabled = false;
                if(window.recaptchaWidgetId) grecaptcha.reset(window.recaptchaWidgetId);
            });
        }

        function verifyOTP() {
            const code = document.getElementById('otpInput').value;
            if(!code) return alert("กรุณากรอกรหัส");
            confirmationResult.confirm(code).catch(() => alert("❌ รหัสผิด"));
        }

        function logout() {
            if(confirm("ออกจากระบบ?")) auth.signOut().then(() => window.location.href = window.location.pathname);
        }

        // --- โหลดข้อมูลตู้ ---
        async function loadLockers() {
            const grid = document.getElementById('lockerGrid');
            grid.innerHTML = "⏳ กำลังโหลด...";
            try {
                const res = await fetch(API_URL + "?action=checkStatus");
                const data = await res.json();
                grid.innerHTML = "";
                data.forEach(x => {
                    let btn = document.createElement('button');
                    let isFree = x.status === 'Available';
                    btn.className = `l-btn ${isFree?'available':'occupied'}`;
                    btn.innerHTML = `ตู้ ${x.locker}<br><span style="font-size:0.8em">${isFree?'ว่าง':'เต็ม'}</span>`;
                    btn.disabled = !isFree;
                    if(isFree) btn.onclick = () => {
                        selectedLocker = x.locker;
                        document.getElementById('targetLocker').innerText = x.locker;
                        document.getElementById('reserveForm').classList.remove('hidden');
                        document.getElementById('reserveForm').scrollIntoView({behavior:'smooth'});
                    };
                    grid.appendChild(btn);
                });
            } catch(e) { grid.innerHTML = "Error loading"; }
        }

        // --- จองตู้ (ส่ง 4 ตัวท้าย + ✅ ส่ง LINE ID) ---
        async function doReserve() {
            const ph = document.getElementById('rPhone').value;
            if(!/^\d{4}$/.test(ph)) return alert("กรุณากรอกเลข 4 ตัวท้ายให้ถูกต้อง");
            
            const btn = event.target;
            btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
            try {
                await fetch(API_URL, { 
                    method:'POST', 
                    body:JSON.stringify({
                        action:'reserve', 
                        locker:selectedLocker, 
                        phone:ph, 
                        sender:currentUserPhone,
                        lineId: currentLineUserId // ✅ ส่ง ID ไปด้วย เพื่อแจ้งเตือน!
                    }) 
                });
                alert("✅ ฝากของสำเร็จ! (รหัสรับคือ " + ph + ")"); 
                nav('menu');
            } catch(e) { alert("Error"); }
            btn.innerText = "ยืนยันการฝาก"; btn.disabled = false;
        }

        // --- ค้นหา (ใช้ 4 ตัวท้าย) ---
        async function doSearch() {
            const ph = document.getElementById('sPhone').value;
            if(!/^\d{4}$/.test(ph)) return alert("กรุณากรอกเลข 4 ตัวท้าย");
            
            const box = document.getElementById('resultBox');
            box.innerHTML = "🔍 กำลังค้นหา...";
            try {
                const res = await fetch(`${API_URL}?action=find&phone=${ph}`);
                const data = await res.json();
                if(data.found) {
                    box.innerHTML = `<div style="background:#d4edda; padding:15px; border-radius:10px;"><h3>🎉 พบพัสดุ!</h3><p>ตู้ ${data.locker}</p><button class="btn" onclick="doClear('${data.locker}')">เปิดตู้รับของ</button></div>`;
                } else {
                    box.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:10px; color:red;">❌ ไม่พบพัสดุ (เบอร์ลงท้าย ${ph})</div>`;
                }
            } catch(e) { box.innerHTML = "Error"; }
        }

        // --- รับของ/เคลียร์ตู้ ---
        async function doClear(n) {
            if(!confirm("ยืนยันรับของ?")) return;
            await fetch(API_URL, { method:'POST', body:JSON.stringify({action:'clear', locker:n}) });
            alert("ตู้ว่างแล้ว"); nav('menu');
        }
    </script>
</body>
</html>

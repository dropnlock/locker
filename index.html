<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Locker System</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; position: relative; }
        .hidden { display: none !important; }
        
        h2 { margin-top: 0; color: #333; }
        h3 { color: #000; font-size: 22px; margin-bottom: 20px;}
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; }
        
        .btn { width: 100%; padding: 12px; background: #06c755; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #05b34c; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .l-btn { padding: 15px 5px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; background: white; text-align: center; }
        .l-btn:active { transform: scale(0.95); }
        
        .available { border: 2px solid #28a745; color: #28a745; background-color: #e8f5e9; } 
        .occupied { border: 2px solid #dc3545; color: #dc3545; background-color: #fce4e4; cursor: not-allowed; opacity: 0.7; }
        .pickingup { border: 2px solid #ffc107; color: #b08d00; background-color: #fff8e1; cursor: not-allowed; } 
        
        .back-btn { background: none; border: none; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; padding: 0; display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn:hover { color: #555; }

        .menu-btn { background: #007bff; margin-bottom: 15px; padding: 15px; font-size: 18px; }
        .liff-status { font-size: 12px; color: gray; margin-top: 10px; }
        .liff-ok { color: #06c755; font-weight: bold; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .register-box { background: #fff3cd; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <div class="container">
        <div id="pageLogin">
            <h2>🔐 เข้าสู่ระบบ</h2>
            <p>กรุณากรอกเบอร์โทรศัพท์เพื่อรับ OTP</p>
            <input type="tel" id="loginPhone" placeholder="+66xxxxxxxxx" value="+66">
            <div id="recaptcha-container" style="margin: 10px auto;"></div>
            <button class="btn" onclick="sendOTP()">📩 รับรหัส OTP</button>
            <div id="liffStatusLogin" class="liff-status">กำลังเชื่อมต่อ LINE...</div>
        </div>

        <div id="pageOTP" class="hidden">
            <h2>📱 ยืนยันรหัส OTP</h2>
            <p>กรอกรหัส 6 หลักที่ได้รับทาง SMS</p>
            <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="letter-spacing: 5px; font-size: 20px;">
            <button class="btn" onclick="verifyOTP()">ยืนยัน</button>
            <button class="btn btn-secondary" onclick="location.reload()">ย้อนกลับ</button>
        </div>

        <div id="pageMenu" class="hidden">
            <h2>📦 Smart Locker</h2>
            <p id="welcomeUser" style="color:#666; font-size:14px; margin-bottom: 5px;">ยินดีต้อนรับ</p>
            <p id="liffStatusMenu" class="liff-status" style="margin-bottom: 20px;">...</p>
            
            <div class="register-box">
                <p style="margin:0 0 10px 0; font-size:14px; color:#856404; font-weight:bold;">🔔 ลงทะเบียนรับแจ้งเตือนผ่าน LINE</p>
                <input type="tel" id="regPhone" placeholder="กรอกเบอร์โทรศัพท์ (10 หลัก)" maxlength="10" style="background:white; letter-spacing: 2px;">
                <button class="btn" style="background:#ffc107; color:black;" onclick="registerMember()">ยืนยันลงทะเบียน</button>
            </div>
            <button class="btn menu-btn" onclick="nav('sender')">📦 ฝากของ / จองตู้</button>
            <button class="btn menu-btn" style="background:#17a2b8;" onclick="nav('receiver')">🔍 ค้นหาพัสดุ / รับของ</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div id="pageSender" class="hidden">
            <button class="back-btn" onclick="nav('menu')">⬅ กลับ</button>
            <h3>เลือกตู้ที่ว่าง</h3>
            <div id="lockerGrid" class="grid"><div class="loader"></div></div>
            
            <div id="reserveForm" class="hidden" style="margin-top:20px; background:#f8f9fa; padding:15px; border-radius:10px;">
                <p style="margin:5px 0;">คุณเลือก: <b style="color:#007bff; font-size:1.2em;">ตู้ <span id="targetLocker">-</span></b></p>
                <p style="font-size:14px; color:#555; margin-bottom:5px;">ระบุเบอร์ผู้รับ (10 หลัก)</p>
                <input type="tel" id="rPhone" placeholder="เช่น 0812345678" maxlength="10" style="font-size: 20px; letter-spacing: 2px; font-weight:bold;">
                <button class="btn" onclick="doReserve()">ยืนยันการฝาก</button>
            </div>
        </div>

        <div id="pageReceiver" class="hidden">
            <button class="back-btn" onclick="nav('menu')">⬅ กลับ</button>
            <h3>🔍 ค้นหาพัสดุ</h3>
            <p>กรอกเบอร์โทรศัพท์ 10 หลัก</p>
            <input type="tel" id="sPhone" placeholder="08xxxxxxxx" maxlength="10" style="font-size: 20px; letter-spacing: 2px; font-weight:bold;">
            <button class="btn" onclick="doSearch()">ค้นหา</button>
            <div id="resultBox" style="margin-top:15px;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // ============================================
        // ⚙️ ส่วนตั้งค่า (อัปเดตเป็นลิงก์ล่าสุดของคุณแล้ว)
        // ============================================
        const API_URL = "https://script.google.com/macros/s/AKfycbxkOdLElNFk0IgyQLaJLe8Z-16-cj75xgiag8MDxS7Y19lcfBq8MfRg0UMAxJ4bMAF1Sw/exec";
        const LIFF_ID = "2009731576-F5z0cdtp"; 
        const firebaseConfig = {
          apiKey: "AIzaSyD2pT2lhklqjcyhCtnZlKB4mExom8X3SZA",
          authDomain: "locker-project-01.firebaseapp.com",
          projectId: "locker-project-01",
          storageBucket: "locker-project-01.firebasestorage.app",
          messagingSenderId: "395172693891",
          appId: "1:395172693891:web:f4261fd635fb2cc852d8b6",
          measurementId: "G-63FCGRHW6J"
        };
        // ============================================

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.languageCode = 'th';

        let confirmationResult = null, currentUserPhone = "", selectedLocker = null, currentLineUserId = ""; 

        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentLineUserId = profile.userId;
                    updateLiffStatus(true, profile.displayName);
                } else {
                    if (liff.isInClient()) liff.login();
                    else updateLiffStatus(false);
                }
            } catch (err) { updateLiffStatus(false); }
        }
        
        function updateLiffStatus(isLoggedIn, name = "") {
            const msg = isLoggedIn ? `✅ เชื่อมต่อ LINE: ${name}` : `⚠️ ไม่ได้เชื่อมต่อ LINE (จะไม่ได้รับแจ้งเตือน)`;
            const elLogin = document.getElementById('liffStatusLogin');
            const elMenu = document.getElementById('liffStatusMenu');
            if(elLogin) { elLogin.innerText = msg; elLogin.className = "liff-status " + (isLoggedIn?"liff-ok":""); }
            if(elMenu) { elMenu.innerText = msg; elMenu.className = "liff-status " + (isLoggedIn?"liff-ok":""); }
        }

        initLIFF(); 

        const isLineApp = /Line/i.test(navigator.userAgent);
        auth.setPersistence(isLineApp ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);

        auth.onAuthStateChanged((user) => {
            const allPages = ['pageLogin', 'pageOTP', 'pageMenu', 'pageSender', 'pageReceiver'];
            if (user) {
                currentUserPhone = user.phoneNumber; 
                document.getElementById('welcomeUser').innerText = "ผู้ใช้งาน: " + currentUserPhone;
                document.getElementById('pageLogin').classList.add('hidden');
                document.getElementById('pageOTP').classList.add('hidden');
                checkDeepLink();
            } else {
                allPages.forEach(id => document.getElementById(id)?.classList.add('hidden'));
                document.getElementById('pageLogin').classList.remove('hidden');
                renderRecaptcha();
            }
        });

        function checkDeepLink() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('page') === 'sender') nav('sender');
            else if (params.get('page') === 'receiver') nav('receiver');
            else nav('menu');
        }

        function nav(p) {
            ['pageMenu', 'pageSender', 'pageReceiver'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if(p=='menu') document.getElementById('pageMenu').classList.remove('hidden');
            if(p=='sender') { 
                document.getElementById('pageSender').classList.remove('hidden'); 
                loadLockers(); 
                document.getElementById('rPhone').value = ""; 
                document.getElementById('reserveForm').classList.add('hidden');
            }
            if(p=='receiver') { 
                document.getElementById('pageReceiver').classList.remove('hidden'); 
                document.getElementById('resultBox').innerHTML=""; 
                
                if(currentUserPhone) {
                    let localPhone = currentUserPhone;
                    if (localPhone.startsWith("+66")) {
                        localPhone = "0" + localPhone.substring(3);
                    }
                    document.getElementById('sPhone').value = localPhone;
                }
            }
        }

        function renderRecaptcha() {
            const container = document.getElementById('recaptcha-container');
            if(container && container.hasChildNodes()) return;
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'normal' });
                window.recaptchaVerifier.render();
            }
        }

        function sendOTP() {
            const ph = document.getElementById('loginPhone').value;
            if (ph.length < 10) return alert("กรุณากรอกเบอร์ให้ครบ");
            const btn = event.target;
            btn.innerText = "กำลังส่ง..."; btn.disabled = true;
            renderRecaptcha(); 

            auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then((res) => {
                confirmationResult = res;
                document.getElementById('pageLogin').classList.add('hidden');
                document.getElementById('pageOTP').classList.remove('hidden');
                btn.innerText = "รับรหัส OTP"; btn.disabled = false;
            }).catch(e => { 
                alert("Error: " + e.message); 
                btn.innerText = "รับรหัส OTP"; btn.disabled = false;
                if(window.recaptchaWidgetId) grecaptcha.reset(window.recaptchaWidgetId);
            });
        }

        function verifyOTP() {
            const code = document.getElementById('otpInput').value;
            if(!code) return alert("กรุณากรอกรหัส");
            confirmationResult.confirm(code).catch(() => alert("❌ รหัสผิด"));
        }

        function logout() {
            if(confirm("ออกจากระบบ?")) auth.signOut().then(() => window.location.href = window.location.pathname);
        }

        async function registerMember() {
            const ph = document.getElementById('regPhone').value;
            if(!/^\d{10}$/.test(ph)) return alert("กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก");
            if(!currentLineUserId) return alert("⚠️ ไม่พบ LINE ID\nกรุณาเปิดลิงก์นี้ผ่านแอป LINE เพื่อลงทะเบียน");
            const btn = event.target;
            btn.innerText = "กำลังบันทึก..."; btn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'register', pin: ph, lineId: currentLineUserId })
                });
                const result = await response.json();
                if(result.status === "success") {
                    alert("✅ ลงทะเบียนสำเร็จ!\nเมื่อมีคนฝากของให้เบอร์ " + ph + " ระบบจะแจ้งเตือนคุณทันที");
                    document.getElementById('regPhone').value = ""; 
                } else alert("❌ " + result.message);
            } catch(e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            btn.innerText = "ยืนยันลงทะเบียน"; btn.disabled = false;
        }

        async function loadLockers() {
            const grid = document.getElementById('lockerGrid');
            grid.innerHTML = '<div class="loader"></div>';
            try {
                const res = await fetch(API_URL + "?action=checkStatus");
                const data = await res.json();
                grid.innerHTML = "";
                
                data.forEach(x => {
                    let btn = document.createElement('button');
                    let isFree = x.status === 'Available';
                    let isPickingUp = x.status === 'PickingUp';
                    
                    if (isFree) btn.className = 'l-btn available';
                    else if (isPickingUp) btn.className = 'l-btn pickingup';
                    else btn.className = 'l-btn occupied';

                    let statusText = isFree ? 'ว่าง' : (isPickingUp ? 'รอมารับ' : 'เต็ม');
                    btn.innerHTML = `ตู้ ${x.locker}<br><span style="font-size:0.9em; font-weight:normal;">${statusText}</span>`;
                    btn.disabled = !isFree; 
                    
                    if(isFree) btn.onclick = () => {
                        selectedLocker = x.locker;
                        document.getElementById('targetLocker').innerText = x.locker;
                        document.getElementById('reserveForm').classList.remove('hidden');
                        document.getElementById('reserveForm').scrollIntoView({behavior:'smooth'});
                    };
                    grid.appendChild(btn);
                });
            } catch(e) { 
                grid.innerHTML = `<div style="grid-column: span 3; color: red;"><b>Error loading!</b><br>ไม่สามารถดึงข้อมูลตู้ได้</div>`;
            }
        }

        async function doReserve() {
            const ph = document.getElementById('rPhone').value;
            if(!/^\d{10}$/.test(ph)) return alert("กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก");
            const btn = event.target;
            btn.innerText = "กำลังบันทึก..."; btn.disabled = true;

            try {
                const res = await fetch(API_URL, { 
                    method:'POST', 
                    body: JSON.stringify({ action: 'reserve', locker: selectedLocker, pin: ph, lineId: currentLineUserId }) 
                });
                const result = await res.json();
                if(result.status === "success") {
                    alert("✅ ฝากของสำเร็จ!\nตู้กำลังเปิด... กรุณาใส่ของและปิดตู้ให้สนิท"); 
                    nav('menu');
                } else alert("❌ " + result.message);
            } catch(e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            btn.innerText = "ยืนยันการฝาก"; btn.disabled = false;
        }

        async function doSearch() {
            const ph = document.getElementById('sPhone').value;
            if(!/^\d{10}$/.test(ph)) return alert("กรุณากรอกเบอร์โทรศัพท์ 10 หลัก");
            const box = document.getElementById('resultBox');
            box.innerHTML = "🔍 กำลังค้นหา...";
            try {
                const res = await fetch(`${API_URL}?action=find&pin=${ph}`); 
                const data = await res.json();
                if(data.found) {
                    box.innerHTML = `<div style="background:#d4edda; padding:15px; border-radius:10px;"><h3>🎉 พบพัสดุ!</h3><p>ตู้ ${data.locker}</p><button class="btn" onclick="doClear('${data.locker}')">เปิดตู้รับของ</button></div>`;
                } else box.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:10px; color:red;">❌ ไม่พบพัสดุ (สำหรับเบอร์ ${ph})</div>`;
            } catch(e) { box.innerHTML = "Error"; }
        }

        async function doClear(n) {
            if(!confirm("ยืนยันการรับของ? (ตู้จะเปิดทันที)")) return;
            try {
                const res = await fetch(API_URL, { method:'POST', body:JSON.stringify({action:'clear', locker:n}) });
                const result = await res.json();
                if(result.status === "success"){
                     alert("🔓 ตู้กำลังเปิด... กรุณารับพัสดุและปิดตู้ให้สนิทครับ"); 
                     nav('menu');
                }
            } catch(e) { alert("Error"); }
        }
    </script>
</body>
</html>
